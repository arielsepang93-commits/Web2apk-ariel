name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string

      app_name:
        required: true
        type: string

      package_name:
        required: true
        type: string

      web_url:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEB_URL: ${{ inputs.web_url }}
        run: |
          mkdir -p build-project
          cp -R android-template/. build-project/

          python3 scripts/prepare.py \
            "$APP_NAME" \
            "$PACKAGE_NAME" \
            "$WEB_URL" \
            build-project

      - name: Build APK
        working-directory: build-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
          build-project/app/build/outputs/apk/debug/app-debug.apk \
          "release/TOOLS-ARIEL-${{ inputs.build_id }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
          "${{ inputs.build_id }}" \
          "release/TOOLS-ARIEL-${{ inputs.build_id }}.apk" \
          --title "TOOLS ARIEL ${{ inputs.build_id }}" \
          --notes "APK generated by TOOLS ARIEL Web2APK"
